name: Deploy portfolio to GitHub Pages

on:
  push:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - name: Install portfolio dependencies
        run: pnpm --dir artifacts/portfolio install --no-frozen-lockfile --ignore-scripts
      - name: Check API base URL config
        run: |
          if [ -z "${{ vars.VITE_API_BASE_URL }}" ]; then
            echo "::warning::VITE_API_BASE_URL repo variable is not set. Chat will not work on GitHub Pages until this is configured."
          fi
      - name: Build portfolio
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_OPENROUTER_API_KEY: ${{ vars.VITE_OPENROUTER_API_KEY }}
          VITE_OPENROUTER_MODEL: ${{ vars.VITE_OPENROUTER_MODEL }}
        run: pnpm --dir artifacts/portfolio build
      - name: Add Pages metadata
        run: touch artifacts/portfolio/dist/public/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v4
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/portfolio/dist/public

  deploy:
    needs: build-and-publish
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
        id: deployment
      - name: Show deployed URL
        run: echo "Deployed to ${{ steps.deployment.outputs.page_url }}"
